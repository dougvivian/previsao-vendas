[project]
name = "previsao-vendas"
version = "0.1.0"
description = "Pipeline de previsao de vendas com FastAPI, scikit-learn e Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
